<script>/* Apertura sempre fresca: se il documento arriva dalla cache HTTP (nessun trasferimento di rete) lo ricarica subito, nascondendola, prima di disegnare la pagina (anche tornando indietro). */(function(){try{var n=performance.getEntriesByType('navigation')[0];if(n){if(n.type==='navigate'||n.type==='back_forward'){if(n.transferSize===0){document.documentElement.style.visibility='hidden';location.reload();}}}}catch(e){}})();</script>
<script>/* Sempre aggiornata: quando la pagina torna in primo piano (riapertura app, sblocco schermo, cambio scheda) dopo almeno 10 minuti in background si ricarica subito, salvo se stai compilando un campo o hai scelto un file. */(function(){var t=0;function busy(){var a=document.activeElement;if(a){var g=a.tagName;if(g==='INPUT'||g==='TEXTAREA'||g==='SELECT'){return true;}}var f=document.querySelectorAll('input[type=file]');for(var i=0;i<f.length;i++){if(f[i].files){if(f[i].files.length){return true;}}}return false;}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){t=Date.now();}else{if(t){if(Date.now()-t>600000){if(!busy()){location.reload();}}}t=0;}});window.addEventListener('pageshow',function(e){if(e.persisted){location.reload();}});})();</script>

<script id="theme-switcher">
(function() {
  var VALID_THEMES = ['scuro', 'chiaro', 'black', 'blu', 'green', 'pink', 'red', 'notte', 'violet', 'blackamoled', 'orange', 'teal', 'gold'];
  function applyTheme(name, persist) {
    if (VALID_THEMES.indexOf(name) === -1) return false;
    if (name === 'scuro') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', name);
    }
    if (persist) {
      try { localStorage.setItem('siteTheme', name); } catch (e) {}
    }
    return true;
  }
  window.setAppTheme = function(name) { applyTheme(name, true); };
  var params = new URLSearchParams(window.location.search);
  var fromUrl = params.get('theme');
  if (fromUrl) {
    applyTheme(fromUrl, true);
  } else {
    var stored = null;
    try { stored = localStorage.getItem('siteTheme'); } catch (e) {}
    if (stored) applyTheme(stored, false);
  }
})();
</script>

function raMm(date) {

    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate() + gi);
    // usa la data vera del giorno ("03/10"): dopo mezzanotte la cache puo' partire da ieri
    var dm = String(g.data || '').match(/^(\d{1,2})\/(\d{1,2})$/);
    if (dm) {
      base = new Date(now.getFullYear(), +dm[2] - 1, +dm[1]);
      if (base - now > 200 * 86400000) base.setFullYear(base.getFullYear() - 1);
      if (now - base > 200 * 86400000) base.setFullYear(base.getFullYear() + 1);
    }
    (g.ore || []).forEach(function(o) {
      var p = String(o.ora).split(':');
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), parseInt(p[0], 10), parseInt(p[1] || '0', 10));
      if (d >= new Date(now.getTime() - 3600000)) out.push({ t: d, temp: o.temp, vento: o.vento, prob: o.pioggia_prob });
    });
  });
  return out;
}

// ---------- navigazione ----------
var state = { view: 'home' };
function go(view, push) {
  state = { view: view };
  if (push !== false) history.pushState(state, '', location.pathname + (view === 'home' ? '' : '#' + view));
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', function(e) { state = e.state || { view: 'home' }; render(); });

function render() {
  var sec = SECTIONS.filter(function(s) { return s.id === state.view; })[0];
  // Le sezioni "meteo" si aprono dalle card della pagina principale: titolo proprio,
  // niente briciola "Utile" e pulsanti larghi verso il grafico storico giusto.
  var h1 = document.querySelector('h1'), sub = document.querySelector('.subtitle');
  if (sec && sec.meteo) {
    h1.textContent = sec.icon + ' ' + sec.name;
    sub.textContent = sec.sub || 'Dati e consigli dalla stazione meteo di Motta Visconti';
    $('crumb').innerHTML = '';
    // primo pulsante largo; eventuali altri (es. singoli inquinanti) in griglia compatta
    $('storicoBar').innerHTML = '<a class="storico-btn" href="' + sec.storico[0][1] + '">' + sec.storico[0][0] + '</a>' +
      (sec.storico.length > 1 && sec.id !== 'nebbia' ? '<div class="storico-mini">' + sec.storico.slice(1).map(function(x) { return '<a href="' + x[1] + '">📈 ' + x[0] + '</a>'; }).join('') + '</div>'
        : sec.storico.slice(1).map(function(x) { return '<a class="storico-btn" href="' + x[1] + '">' + x[0] + '</a>'; }).join(''));
    document.title = sec.name + ' - Meteo Motta Visconti';
  } else {
    h1.textContent = '💡 Utile da sapere';
    sub.textContent = 'Informazioni pratiche su Motta Visconti';
    $('storicoBar').innerHTML = '';
    var crumb = '<button onclick="go(\'home\')">💡 Utile</button>';
    if (sec) crumb += '<span class="sep">›</span><span class="current">' + sec.icon + ' ' + sec.name + '</span>';
    $('crumb').innerHTML = crumb;
    document.title = 'Utile da sapere - Motta Visconti';
  }
  if (!sec) return renderHome();
  loading();
  var fn = VIEWS[sec.id];
  Promise.resolve().then(fn).catch(function(e) { console.error(e); failed(); });
}

function renderHome() {
  $('app').innerHTML = '<div class="grid">' + SECTIONS.filter(function(s) { return !s.meteo; }).map(function(s) {
    return '<div class="sec-card" onclick="go(\'' + s.id + '\')"><span class="icon">' + s.icon + '</span><span class="name">' + s.name + '</span><span class="hint">' + s.hint + '</span></div>';
  }).join('') + '</div>';
}

var VIEWS = {};

// =================== ORTO E GIARDINO ===================
VIEWS.orto = function() {
  return Promise.all([loadInflux('storico_temp.csv'), loadInflux('pioggia.csv'), loadJSON('/previsioni.php').catch(function() { return null; })]).then(function(r) {
    var temps = r[0]['ecowitt_outdoor_temperature'] || [];
    var rain = r[1]['value'] || [];
    var prev = r[2];

    // Tmin/Tmax per giorno locale
    var days = {};
    temps.forEach(function(p) {
      var k = dateKey(p.t);
      var d = days[k] || (days[k] = { min: 99, max: -99, n: 0, date: new Date(p.t.getFullYear(), p.t.getMonth(), p.t.getDate()) });
      if (p.v < d.min) d.min = p.v;
      if (p.v > d.max) d.max = p.v;
      d.n++;
    });
    // pioggia.csv: un valore per giorno, etichettato con la mezzanotte di fine giornata
    var rainByDay = {};
    rain.forEach(function(p) { rainByDay[dateKey(new Date(p.t.getTime() - 60000))] = p.v; });

    var today = new Date();
    var list = [];
    for (var i = 7; i >= 1; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var k = dateKey(d), td = days[k];
      if (!td || td.n < 100) continue; // giornata incompleta
      var et = hargreaves(td.min, td.max, d);
      list.push({ date: d, min: td.min, max: td.max, rain: rainByDay[k] || 0, et: et });
    }
    if (!list.length) return failed();

    var sumRain = 0, sumEt = 0;
    list.forEach(function(x) { sumRain += x.rain; sumEt += x.et; });
    var deficit = sumEt - sumRain;
    var rainNext = 0, minNext = 99;
    if (prev && prev.giorni) {
      prev.giorni.slice(0, 2).forEach(function(g) { rainNext += g.pioggia || 0; });
      prev.giorni.slice(0, 3).forEach(function(g) { if (g.temp_min < minNext) minNext = g.temp_min; });
    }
    var tmean = list.reduce(function(a, x) { return a + (x.min + x.max) / 2; }, 0) / list.length;
    var month = today.getMonth();
    var riposo = (month >= 10 || month <= 1) && tmean < 8;

    var v;
    if (rainNext >= 5) {
      v = verdict('🌧️', 'Aspetta la pioggia', 'Nelle prossime 48 ore sono previsti circa <b>' + fmt(rainNext, 0) + ' mm</b> di pioggia: annaffiare adesso sarebbe acqua sprecata.', BLUE);
    } else if (riposo) {
      v = verdict('😴', 'Piante a riposo', 'Con il freddo le piante consumano pochissima acqua. Annaffia solo i vasi riparati se la terra è asciutta, mai quando è prevista una gelata.', BLUE);
    } else if (deficit > 15) {
      v = verdict('💧', 'Annaffia abbondante', 'Negli ultimi ' + list.length + ' giorni il terreno ha perso circa <b>' + fmt(deficit, 0) + ' mm</b> in più di quanta pioggia è caduta. Dai circa <b>' + fmt(Math.min(deficit, 25), 0) + ' litri per m²</b>, meglio in due volte.', ORANGE);
    } else if (deficit > 5) {
      v = verdict('🚿', 'Annaffiatura leggera', 'Il terreno è un po\' in deficit (circa <b>' + fmt(deficit, 0) + ' mm</b>). Bastano <b>' + fmt(deficit, 0) + ' litri per m²</b>, soprattutto per ortaggi e vasi.', YELLOW);
    } else {
      v = verdict('✅', 'Non serve annaffiare', 'La pioggia degli ultimi giorni basta a coprire l\'acqua evaporata.', GREEN);
    }

    var html = v;
    if (minNext <= 2) {
      html += verdict('🥶', 'Rischio gelata', 'Nei prossimi giorni la minima prevista scende a <b>' + fmt(minNext, 0) + '°C</b>. Copri le piante delicate con tessuto non tessuto e porta al riparo i vasi.', RED);
    }
    html += card(
      sectionTitle('📊 Bilancio acqua ultimi ' + list.length + ' giorni') +
      row('Pioggia caduta', fmt(sumRain, 1) + ' mm', BLUE) +
      row('Acqua evaporata (stimata)', fmt(sumEt, 1) + ' mm', ORANGE) +
      row('Pioggia prevista 48 ore', fmt(rainNext, 1) + ' mm') +
      '<table class="tbl"><tr><th>Giorno</th><th>Min/Max</th><th>Pioggia</th><th>Evap.</th></tr>' +
      list.map(function(x) {
        return '<tr><td>' + dayLabel(x.date) + '</td><td>' + fmt(x.min, 0) + '° / ' + fmt(x.max, 0) + '°</td><td>' + fmt(x.rain, 1) + '</td><td>' + fmt(x.et, 1) + '</td></tr>';
      }).join('') + '</table>' +
      note('1 mm di pioggia = 1 litro d\'acqua per metro quadro. L\'evaporazione è stimata con il metodo FAO di Hargreaves dalle temperature della stazione.')
    );
    html += card(sectionTitle('💡 Consigli') +
      tip('🌙', 'Annaffia la sera tardi o la mattina presto: di giorno metà dell\'acqua evapora prima di arrivare alle radici.') +
      tip('🪣', 'Meglio poche annaffiature abbondanti che tante leggere: le radici crescono più in profondità.') +
      tip('🍂', 'Uno strato di pacciamatura (foglie, paglia, corteccia) riduce l\'evaporazione anche del 50%.') +
      tip('🪴', 'I vasi si asciugano molto più in fretta della terra: controllali anche quando l\'orto non ne ha bisogno.'));
    $('app').innerHTML = html;
  });
};

// =================== NEBBIA, BRINA, GHIACCIO ===================
VIEWS.nebbia = function() {
  return Promise.all([loadInflux('live.csv'), loadJSON('/previsioni.php').catch(function() { return null; })]).then(function(r) {
    var live = r[0], prev = r[1];
    var t = latest(live['ecowitt_outdoor_temperature']), h = latest(live['ecowitt_humidity']);
    if (!t || !h) return failed();
    var td = dewPoint(t.v, h.v), spread = t.v - td;

    // notte prossima: dalle 20 di stasera (o da adesso) alle 9 di domattina
    var now = new Date();
    var start = now.getHours() >= 9 ? new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20) : now;
    if (start < now) start = now;
    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + (start.getHours() >= 9 ? 1 : 0), 9);
    var night = prev ? forecastHours(prev).filter(function(x) { return x.t >= start && x.t <= end; }) : [];
    var minN = null, minAt = null, windAvg = 0;
    night.forEach(function(x) { if (minN === null || x.temp < minN) { minN = x.temp; minAt = x.t; } windAvg += x.vento; });
    if (night.length) windAvg /= night.length;

    var html = card(
      sectionTitle('🌡️ Adesso') +
      row('Temperatura', fmt(t.v) + '°C') +
      row('Umidità', fmt(h.v, 0) + '%') +
      row('Punto di rugiada', fmt(td) + '°C', BLUE) +
      row('Differenza', fmt(spread) + '°C', spread <= 2 ? ORANGE : null) +
      note('Il punto di rugiada è la temperatura a cui l\'aria diventa satura: se l\'aria si raffredda fin lì si forma condensa, cioè nebbia, rugiada o brina.'));

    if (minN !== null) {
      var condensa = minN <= td + 1;
      var calmo = windAvg <= 7;
      var vs = '';
      if (minN <= 0 && condensa) vs += verdict('❄️', 'Brina e ghiaccio probabili', 'Stanotte la minima prevista è <b>' + fmt(minN, 0) + '°C</b> verso le ' + hhmm(minAt) + ', sotto il punto di rugiada. Al mattino auto e prati bianchi: attenzione al ghiaccio su ponti, strade di campagna e marciapiedi in ombra.', RED);
      else if (minN <= 1) vs += verdict('🧊', 'Possibile ghiaccio', 'Minima prevista <b>' + fmt(minN, 0) + '°C</b> verso le ' + hhmm(minAt) + '. Dove la strada è bagnata può gelare: prudenza al mattino presto.', ORANGE);
      if (minN > 0 && condensa && calmo) vs += verdict('🌫️', 'Nebbia probabile', 'L\'aria stanotte si raffredda fino al punto di rugiada (minima ' + fmt(minN, 0) + '°C) con vento debole. Facile nebbia nella valle del Ticino dopo mezzanotte e al mattino: fendinebbia e distanza di sicurezza.', ORANGE);
      else if (minN > 0 && condensa) vs += verdict('💧', 'Rugiada al mattino', 'L\'aria raggiunge la saturazione ma il vento dovrebbe impedire una nebbia fitta. Probabili foschie e rugiada.', YELLOW);
      if (!vs) vs = verdict('✅', 'Nessun problema previsto', 'Stanotte la minima prevista (' + fmt(minN, 0) + '°C) resta sopra il punto di rugiada: nebbia e brina poco probabili.', GREEN);
      html = vs + html;
      html += card(sectionTitle('🌙 Stanotte (previsione)') +
        row('Minima prevista', fmt(minN, 0) + '°C alle ' + hhmm(minAt)) +
        row('Vento medio previsto', fmt(windAvg, 0) + ' km/h'));
    }
    html += card(sectionTitle('💡 Da sapere') +
      tip('🚗', 'Con la nebbia usa anabbaglianti e fendinebbia posteriore solo sotto i 50 m di visibilità, mai gli abbaglianti: riflettono sulla nebbia e accecano.') +
      tip('🌉', 'I ponti gelano per primi: l\'aria li raffredda sopra e sotto. Vale anche per il ponte di Bereguardo.') +
      tip('🌫️', 'Nella pianura padana la nebbia è più frequente da ottobre a gennaio, con alta pressione, cielo sereno e notti lunghe.'));
    $('app').innerHTML = html;
  });
};

// =================== BAROMETRO ===================
VIEWS.barometro = function() {
  return loadInflux('live.csv').then(function(live) {
    var s = live['ecowitt_absolute_pressure'];
    var cur = latest(s);
    if (!cur) return failed();
    var p3 = valueAt(s, new Date(cur.t.getTime() - 3 * 3600000));
    var p24 = s[0];
    var d3 = p3 ? cur.v - p3.v : 0, d24 = cur.v - p24.v;

    var v;
    if (d3 <= -3.5) v = verdict('⛈️', 'Calo rapido', 'In 3 ore la pressione è scesa di <b>' + fmt(-d3) + ' hPa</b>. Peggioramento probabile a breve, con vento o temporali.', RED);
    else if (d3 <= -1.5) v = verdict('🌧️', 'Pressione in calo', 'Scesa di <b>' + fmt(-d3) + ' hPa</b> in 3 ore. Possibile peggioramento entro 12-24 ore.', ORANGE);
    else if (d3 >= 3.5) v = verdict('🌬️', 'Aumento rapido', 'Salita di <b>' + fmt(d3) + ' hPa</b> in 3 ore. Tempo in miglioramento, ma possibile vento sostenuto.', YELLOW);
    else if (d3 >= 1.5) v = verdict('🌤️', 'Pressione in aumento', 'Salita di <b>' + fmt(d3) + ' hPa</b> in 3 ore. Tempo in miglioramento o stabile.', GREEN);
    else v = verdict('⚖️', 'Pressione stabile', 'Variazione di soli <b>' + fmt(d3) + ' hPa</b> in 3 ore. Nessun cambiamento in vista a breve.', GREEN);

    // grafico 24 ore
    var vals = s.map(function(x) { return x.v; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (mx - mn < 2) { var c = (mx + mn) / 2; mn = c - 1; mx = c + 1; }
    var t0 = s[0].t.getTime(), t1 = cur.t.getTime();
    var pts = s.map(function(x) {
      return ((x.t.getTime() - t0) / (t1 - t0) * 300).toFixed(1) + ',' + (90 - (x.v - mn) / (mx - mn) * 80).toFixed(1);
    }).join(' ');
    var svg = '<svg viewBox="0 0 300 100" style="width:100%;height:110px;margin-top:6px"><polyline points="' + pts + '" fill="none" stroke="var(--accent-primary)" stroke-width="2.2" stroke-linejoin="round"/></svg>' +
      '<div style="display:flex;justify-content:space-between;font-size:0.7rem;color:var(--text-faint)"><span>' + hhmm(s[0].t) + ' ieri</span><span>min ' + fmt(Math.min.apply(null, vals)) + ' · max ' + fmt(Math.max.apply(null, vals)) + '</span><span>' + hhmm(cur.t) + '</span></div>';

    var html = v + card(
      sectionTitle('📈 Ultime 24 ore') +
      row('Pressione adesso', fmt(cur.v) + ' hPa') +
      row('Rispetto a 3 ore fa', (d3 >= 0 ? '+' : '') + fmt(d3) + ' hPa', d3 <= -1.5 ? ORANGE : (d3 >= 1.5 ? GREEN : null)) +
      row('Rispetto a 24 ore fa', (d24 >= 0 ? '+' : '') + fmt(d24) + ' hPa') + svg);
    html += card(sectionTitle('💡 Come si legge') +
      tip('📉', 'Conta più la <b>tendenza</b> del valore: un calo di oltre 1,5 hPa in 3 ore annuncia spesso un peggioramento, oltre 3,5 hPa un cambiamento brusco.') +
      tip('📈', 'Una salita costante dopo la pioggia indica che arriva l\'alta pressione: cielo più sereno e, in inverno, più nebbia e smog.') +
      tip('🤕', 'Chi soffre di meteopatia avverte spesso mal di testa o dolori articolari proprio durante i cali rapidi.') +
      note('È lo stesso principio dei vecchi barometri da parete, applicato ai dati della stazione.'));
    $('app').innerHTML = html;
  });
};

var BEAUFORT = [
  [1, 0, 'Calma', 'Il fumo sale dritto.'],
  [6, 1, 'Bava di vento', 'Il fumo si inclina, le banderuole stanno ferme.'],
  [12, 2, 'Brezza leggera', 'Si sente il vento sul viso, le foglie frusciano.'],
  [20, 3, 'Brezza tesa', 'Foglie e rametti sempre in movimento, le bandiere si distendono.'],
  [29, 4, 'Vento moderato', 'Si alzano polvere e carta, si muovono i rami piccoli.'],
  [39, 5, 'Vento teso', 'Oscillano gli alberelli, increspature sui canali.'],
  [50, 6, 'Vento fresco', 'Si muovono i rami grandi, fischiano i fili, ombrelli difficili da usare.'],
  [62, 7, 'Vento forte', 'Interi alberi in movimento, fatica a camminare controvento.'],
  [75, 8, 'Burrasca', 'Si spezzano i rami, cadono vasi e oggetti non fissati.'],
  [88, 9, 'Burrasca forte', 'Danni a tegole e coperture, alberi a rischio.'],
  [9999, 10, 'Tempesta', 'Alberi sradicati, danni gravi: resta al chiuso.']
];
function beaufort(kmh) { for (var i = 0; i < BEAUFORT.length; i++) if (kmh < BEAUFORT[i][0]) return BEAUFORT[i]; return BEAUFORT[BEAUFORT.length - 1]; }

VIEWS.vento = function() {
  return Promise.all([loadInflux('live.csv'), loadJSON('/previsioni.php').catch(function() { return null; })]).then(function(r) {
    var live = r[0], prev = r[1];
    var sp = latest(live['ecowitt_wind_speed']), dir = latest(live['ecowitt_wind_direction']), gust = latest(live['ecowitt_max_daily_gust']);
    var speed = sp ? sp.v : 0;
    var b = beaufort(speed), bg = gust ? beaufort(gust.v) : null;
    var html = '';
    var maxPrev = 0, maxDay = null;
    if (prev && prev.giorni) prev.giorni.slice(0, 2).forEach(function(g) { if (g.raffica > maxPrev) { maxPrev = g.raffica; maxDay = g.giorno; } });
    if (maxPrev >= 60) html += verdict('⚠️', 'Raffiche forti in arrivo', maxDay + ' previste raffiche fino a <b>' + maxPrev + ' km/h</b>. Metti al sicuro vasi, ombrelloni, teli e oggetti sui balconi. Evita di parcheggiare sotto gli alberi.', RED);
    else if (maxPrev >= 40) html += verdict('🌬️', 'Giornata ventosa', maxDay + ' previste raffiche fino a <b>' + maxPrev + ' km/h</b>. Fissa teli e oggetti leggeri all\'aperto.', ORANGE);
    else html += verdict('🍃', 'Niente vento forte in vista', 'Oggi e domani raffiche previste fino a ' + maxPrev + ' km/h.', GREEN);

    html += card(sectionTitle('🌬️ Adesso') +
      row('Velocità', fmt(speed) + ' km/h') +
      row('Scala Beaufort', 'forza ' + b[1] + ' · ' + b[2]) +
      (dir && speed >= 2 ? row('Direzione', 'da ' + bussola(dir.v) + ' (' + fmt(dir.v, 0) + '°)') : '') +
      (gust ? row('Raffica massima oggi', fmt(gust.v) + ' km/h · forza ' + bg[1]) : '') +
      note(b[3]));

    if (dir && speed >= 2) {
      var dn = bussola(dir.v), txt;
      if (/^Nord/.test(dn)) txt = 'Il vento da nord scende dalle Alpi: aria più secca e pulita. Quando è forte si chiama favonio (föhn) e spazza via nebbia e smog.';
      else if (/^Sud/.test(dn)) txt = 'Il vento da sud porta aria più umida dal mare e dall\'Appennino: spesso precede nuvole e pioggia.';
      else if (dn === 'Est') txt = 'Il vento da est in pianura è spesso debole e porta aria umida dall\'Adriatico.';
      else txt = 'Il vento da ovest arriva dal Piemonte e dalle Alpi occidentali, spesso dopo il passaggio di una perturbazione.';
      html += card(sectionTitle('🧭 Da dove arriva') + tip('💨', txt));
    }

    html += card(sectionTitle('📋 Scala Beaufort') + '<table class="tbl"><tr><th>Forza</th><th>km/h</th><th>Effetti</th></tr>' +
      BEAUFORT.slice(0, 10).map(function(x, i) {
        var lo = i === 0 ? 0 : BEAUFORT[i - 1][0];
        var me = x[1] === b[1];
        return '<tr' + (me ? ' class="hl"' : '') + '><td>' + x[1] + ' ' + x[2] + '</td><td>' + lo + '–' + (x[0] - 1) + '</td><td>' + x[3] + '</td></tr>';
      }).join('') + '</table>');
    $('app').innerHTML = html;
  });
};

// =================== ARIA E ATTIVITA' ===================
VIEWS.aria = function() {
  return loadInflux('live.csv').then(function(live) {
    var uaqi = latest(live['air_quality_indice_universale_della_qualita_dell_aria_uaqi']);
    var pm10 = latest(live['air_quality_pm10']), pm25 = latest(live['air_quality_pm2_5']);
    var o3 = latest(live['air_quality_ozono']), no2 = latest(live['air_quality_anidride_nitrosa']);
    var pol = latest(live['polline_tipi_rischio_pollinico_complessivo_oggi']);
    if (!uaqi && !pm10 && !pm25) return failed();

    // giudizio = fascia peggiore tra indice e singoli inquinanti (scala /aria_scale.js)
    var items = [];
    if (pm25) items.push({ k: 'pm25', label: 'PM2.5', v: pm25.v, unit: 'µg/m³' });
    if (pm10) items.push({ k: 'pm10', label: 'PM10', v: pm10.v, unit: 'µg/m³' });
    if (o3) items.push({ k: 'o3', label: 'Ozono', v: o3.v, unit: 'ppb' });
    if (no2) items.push({ k: 'no2', label: 'Biossido di azoto', v: no2.v, unit: 'ppb' });
    items.forEach(function(x) { x.lv = ARIA.pollutant(x.k, x.v); });
    var worst = uaqi ? ARIA.uaqi(uaqi.v).index : 0, why = [];
    items.forEach(function(x) { if (x.lv.index > worst) worst = x.lv.index; });
    items.forEach(function(x) { if (x.lv.index >= 3 && x.lv.index === worst) why.push(x.label.toLowerCase()); });
    var L = ARIA.LEVELS[worst];

    var v;
    if (worst <= 1) v = verdict('🏃', 'Via libera', 'Aria ' + L.name.toLowerCase() + ': ottimo momento per correre, andare in bici o arieggiare casa.', L.color);
    else if (worst === 2) v = verdict('🚶', 'Aria discreta', 'Va bene per qualsiasi attività. Chi ha asma o problemi respiratori può preferire sforzi moderati.', L.color);

var RIVER = [
  { id: 'lago', name: 'Lago Maggiore', url: '/lago_maggiore.php' },
  { id: 'vigevano', name: 'Ticino a Vigevano', url: '/vigevano_livello.php' },
  { id: 'bereguardo', name: 'Ticino a Bereguardo', url: '/bereguardo_livello.php' },
  { id: 'pavia', name: 'Ticino a Pavia', url: '/pavia_livello.php' }
];
VIEWS.ticino = function() {
  return Promise.all(RIVER.map(function(st) {
    return loadJSON(st.url + '?days=30').then(function(d) { return { st: st, d: d }; }).catch(function() { return { st: st, d: null }; });
  })).then(function(res) {
    function parseT(s) { var p = s.split(/[- :]/); return new Date(+p[0], p[1] - 1, +p[2], +p[3] || 0, +p[4] || 0); }
    var any = false, rising = [], html = '';
    var cards = res.map(function(r) {
      if (!r.d || !r.d.success || !r.d.points || !r.d.points.length) return card(sectionTitle(r.st.name) + note('Dati non disponibili.'));
      any = true;
      var pts = r.d.points.map(function(p) { return { t: parseT(p.t), v: p.v }; });
      var cur = pts[pts.length - 1];
      var p6 = valueAt(pts, new Date(cur.t.getTime() - 6 * 3600000)), p24 = valueAt(pts, new Date(cur.t.getTime() - 24 * 3600000));
      var vals = pts.map(function(p) { return p.v; });
      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      var d6 = p6 ? cur.v - p6.v : null, d24 = p24 ? cur.v - p24.v : null;
      var pct = mx > mn ? (cur.v - mn) / (mx - mn) * 100 : 50;
      var trend = '⏸️ stabile', tc = null;
      if (d24 !== null && d24 >= 15) { trend = '⬆️ in forte crescita'; tc = RED; rising.push(r.st.name); }
      else if (d24 !== null && d24 >= 4) { trend = '↗️ in crescita'; tc = ORANGE; rising.push(r.st.name); }
      else if (d24 !== null && d24 <= -4) { trend = '↘️ in calo'; tc = GREEN; }
      return card(sectionTitle('🌊 ' + r.st.name) +
        row('Livello adesso', fmt(cur.v) + ' cm') +
        row('Tendenza', trend, tc) +
        (d6 !== null ? row('Ultime 6 ore', (d6 >= 0 ? '+' : '') + fmt(d6) + ' cm') : '') +
        (d24 !== null ? row('Ultime 24 ore', (d24 >= 0 ? '+' : '') + fmt(d24) + ' cm') : '') +
        '<div class="range"><div class="range-fill" style="left:' + pct.toFixed(0) + '%"></div></div>' +
        '<div class="range-lbl"><span>min 30gg ' + fmt(mn) + '</span><span>max 30gg ' + fmt(mx) + '</span></div>');
    });
    if (!any) return failed();
    if (rising.length) html += verdict('📈', 'Livelli in crescita', 'Sta salendo: <b>' + rising.join(', ') + '</b>. Evita le zone golenali e le rive basse, e non lasciare auto nei parcheggi vicino al fiume.', ORANGE);
    else html += verdict('✅', 'Livelli tranquilli', 'Nessuna crescita significativa del Ticino nelle ultime 24 ore.', GREEN);
    html += cards.join('');
    html += card(sectionTitle('💡 Come si legge') +
      tip('📏', 'I valori sono riferiti allo <b>zero dell\'idrometro</b>, non alla profondità dell\'acqua: un numero negativo non vuol dire fiume vuoto.') +
      tip('🔁', 'Il Ticino esce dal Lago Maggiore a Sesto Calende e passa da Vigevano, poi Bereguardo, poi Pavia. Una piena si vede <b>prima a Vigevano</b> e qualche ora dopo più a valle.') +
      tip('🌧️', 'Dopo forti piogge sulle Alpi il lago sale per giorni e il Ticino resta alto a lungo, anche quando qui non piove più.') +
      tip('⚠️', 'Per le allerte ufficiali di piena fanno fede Protezione Civile, ARPA Lombardia e AIPo. Questa pagina mostra solo la tendenza.'));
    $('app').innerHTML = html;
  });
};

// =================== DEFIBRILLATORI (copia della mappa AREU in dae_motta.json) ===================
function distKm(lat1, lon1, lat2, lon2) {
  var dx = (lon2 - lon1) * 78.6, dy = (lat2 - lat1) * 111.2;
  return Math.sqrt(dx * dx + dy * dy);
}
function daeCard(x, km) {
  var maps = 'https://www.google.com/maps/dir/?api=1&destination=' + x.lat + ',' + x.lon + '&travelmode=walking';
  return '<div class="phone" style="cursor:default"><span><b>' + esc(x.nome) + '</b>' + (x.h24 ? ' <span class="pill" style="background:' + GREEN + ';color:#fff">24 ore</span>' : '') + '</span>' +
    '<small>' + esc(x.indirizzo) + (x.comune ? ', ' + esc(x.comune) : '') + ' · ' + (km < 1 ? Math.round(km * 1000) + ' m' : fmt(km, 1) + ' km') + ' · <a href="' + maps + '" target="_blank" rel="noopener">🧭 Portami lì</a>' +
    (x.orario ? '<br>🕑 ' + esc(x.orario) : '<br>🕑 orari non indicati: potrebbe essere accessibile solo quando la struttura è aperta') + '</small></div>';
}

    var motta = d.dae.filter(function(x) { return /motta/i.test(x.comune); });
    var altri = d.dae.filter(function(x) { return !/motta/i.test(x.comune); });

    $('app').innerHTML = html;
    window.daeData = d;
  });
};
function daeVicini() {
  var box = $('daeVicini');
  if (!navigator.geolocation) { box.innerHTML = note('Il tuo telefono non permette di leggere la posizione.'); return; }
  box.innerHTML = note('Cerco la tua posizione...');
  navigator.geolocation.getCurrentPosition(function(pos) {
    var la = pos.coords.latitude, lo = pos.coords.longitude;
    var list = window.daeData.dae.map(function(x) { return { x: x, km: distKm(la, lo, x.lat, x.lon) }; }).sort(function(a, b) { return a.km - b.km; }).slice(0, 3);
    box.innerHTML = card(sectionTitle('📍 I 3 più vicini a te') + list.map(function(o) { return daeCard(o.x, o.km); }).join(''));
  }, function() { box.innerHTML = note('Posizione non disponibile: controlla di aver dato il permesso. Sotto trovi comunque l\'elenco completo.'); }, { enableHighAccuracy: true, timeout: 10000 });
}

function setFuel(f) { fuelSel = f; renderFuel(); }
function renderFuel() {
  var d = window.fuelData;

      if (p.self) { if (self === null || p.prezzo < self) self = p.prezzo; } else { if (serv === null || p.prezzo < serv) serv = p.prezzo; }

    '<div class="pharm"><b>Farmacia Iris</b><br>Piazza della Repubblica, 5 · <a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Farmacia Iris, Piazza della Repubblica 5, Motta Visconti') + '" target="_blank" rel="noopener">📍 Mappa</a></div>' +
    '<div class="pharm"><b>Farmacia Mariani</b><br>Via Roma, 1 · <a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Farmacia Mariani, Via Roma 1, Motta Visconti') + '" target="_blank" rel="noopener">📍 Mappa</a></div>' +
    note('Orari e turni possono cambiare: in caso di dubbio guarda il cartello dei turni esposto fuori dalla farmacia.'));
  var guardia = (h >= 20 || h < 8 || dow === 0 || dow === 6);
  html += card(sectionTitle('📞 Numeri utili') +
    '<a class="phone" href="tel:112"><span>🚨 <b>112</b> Emergenze</span><small>Ambulanza, Carabinieri, Vigili del Fuoco</small></a>' +
    '<a class="phone" href="tel:116117"><span>🩺 <b>116117</b> Guardia medica</span><small>Continuità assistenziale: notti dalle 20 alle 8, weekend e festivi' + (guardia ? ' · <b style="color:' + GREEN + '">attiva adesso</b>' : '') + '</small></a>' +
    '<a class="phone" href="tel:0266101029"><span>☠️ <b>02 6610 1029</b> Centro antiveleni</span><small>Ospedale Niguarda di Milano, 24 ore su 24</small></a>' +
    note('Per un malore non urgente di notte o nel weekend chiama il 116117, non il 112: il 112 serve per le emergenze.'));
  html += '<div class="source">Fonti: turni e indirizzi delle farmacie da <a href="https://www.farmaciediturno.org/" target="_blank" rel="noopener">farmaciediturno.org</a>; numero 116117 da <a href="https://www.regione.lombardia.it/wps/portal/istituzionale/HP/DettaglioRedazionale/servizi-e-informazioni/cittadini/salute-e-prevenzione/Prevenzione-e-benessere/numero-unico-116-117/numero-unico-116-117" target="_blank" rel="noopener">Regione Lombardia</a>; Centro antiveleni dell\'<a href="https://www.ospedaleniguarda.it/" target="_blank" rel="noopener">Ospedale Niguarda</a>.</div>';
  $('app').innerHTML = html;
  return Promise.resolve();
};

// avvio: apertura diretta di una sezione con #id (es. link utile.html#carburanti)
(function() {
  var h = location.hash.replace('#', '');
  var ok = SECTIONS.some(function(s) { return s.id === h; });
  state = { view: ok ? h : 'home' };
  history.replaceState(state, '', location.pathname + (ok ? '#' + h : ''));
  render();
})();
</script>




<div id="pageVisitCounter" style="text-align:center; font-size:0.805rem; color:#888; padding:16px 0 6px; opacity:0.7;"></div>
<script>
(function() {
  var PAGE_SLUG = 'utile';
  function pvcFmt(n) { var s = String(n), o = ""; while (s.length > 3) { o = "." + s.slice(-3) + o; s = s.slice(0, -3); } return s + o; }
  // Nuova visita = prima apertura di QUESTA pagina dopo 30 minuti (timer separato per pagina, cosi' chi arriva dalla home conta anche qui).
  function pvcNuova() { try { var k = 'pvcLastHit_utile', now = Date.now(), last = parseInt(localStorage.getItem(k) || '0', 10); localStorage.setItem(k, String(now)); return (!last || now - last > 1800000) ? 1 : 0; } catch (e) { return 0; } }
  var pvcIsApp = navigator.userAgent.indexOf('MeteoMottaAndroidApp') !== -1;
  function pvcToken() {
    if (pvcIsApp) {
      try { return (typeof AndroidBridge !== 'undefined' && AndroidBridge.getToken) ? AndroidBridge.getToken() : null; } catch (e) { return null; }
    }
    try { return localStorage.getItem('webAccountToken'); } catch (e) { return null; }
  }
  fetch('/visite.php?action=hit&page=' + PAGE_SLUG + '&nuova=' + pvcNuova())
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.success) return;
      var token = pvcToken();
      if (!token) return;
      fetch('/account.php', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(acc) {
          if (acc && acc.success && acc.ruolo === 'owner') {
            var el = document.getElementById('pageVisitCounter');
            if (el) el.innerText = '\ud83d\udc41 ' + pvcFmt(d.visite_totali) + ' visite totali (' + pvcFmt(d.visite_oggi) + ' oggi)';
          }
        })
        .catch(function() {});
    })
    .catch(function() {});
})();
</script>
