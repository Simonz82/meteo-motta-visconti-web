<style>

    h1 { color: var(--text-primary); font-size: 1.3rem; }
    input { width: 100%; box-sizing: border-box; background: var(--bg-card-2); color: var(--text-primary); border: 1px solid var(--border-color-2); padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 1rem; }

    button:disabled { opacity: 0.5; }
    #msg { margin-top: 16px; font-size: 0.9rem; }
    .error { color: #ff5252; }
    .success { color: #4caf50; }

    --shadow-strong: rgba(0,0,0,0.88);
    --shadow-modal: rgba(0,0,0,0.94);
    --overlay-bg: rgba(0,0,0,0.94);

    --card-blur: 4px;
    --card-border-glass: rgba(0,188,212,0.18);
  }

  :root[data-theme="gold"] {
    --bg-page: #000000;
    --bg-card: linear-gradient(145deg, #050505 0%, rgba(255,193,7,0.16) 100%);
    --bg-card-hover: linear-gradient(145deg, #0a0a0a 0%, rgba(255,193,7,0.22) 100%);
    --bg-card-2: linear-gradient(145deg, #030303 0%, rgba(255,193,7,0.11) 100%);
    --bg-card-3: rgba(255,193,7,0.16);
    --bg-card-4: rgba(255,193,7,0.13);
    --bg-elevated: rgba(255,193,7,0.11);
    --bg-deep: #050505;

    --border-color: rgba(255,193,7,0.18);
    --border-color-2: rgba(255,193,7,0.26);
    --border-color-3: rgba(255,193,7,0.36);

    --text-primary: #ffffff;
    --text-secondary: #e2e2e2;
    --text-secondary-2: #b8b8b8;
    --icon-muted: #8f8f8f;
    --text-body: #cfcfcf;
    --text-muted: #a3a3a3;
    --text-muted-2: #999999;
    --text-faint: #8a8a8a;
    --text-faint-2: #797979;
    --text-faint-3: #666666;
    --gauge-track: #2a2a2a;

    --accent-primary: #ffc107;
    --accent-primary-rgb: 255,193,7;
    --accent-secondary: #fff176;
    --accent-secondary-rgb: 255,241,118;

    --shadow-card: rgba(0,0,0,0.75);
    --shadow-soft: rgba(0,0,0,0.8);
    --shadow-strong: rgba(0,0,0,0.88);
    --shadow-modal: rgba(0,0,0,0.94);
    --overlay-bg: rgba(0,0,0,0.94);

    --card-blur: 4px;
    --card-border-glass: rgba(255,193,7,0.18);
  }

  /* Applica il "vetro" (blur) SOLO quando un tema alternativo è attivo.
     La regola non è applicata affatto nel tema di default (nessun
     attributo, o data-theme="scuro"): anche un blur(0px) "innocuo"
     può forzare il browser a promuovere l'elemento su un layer di
     compositing a parte e alterare impercettibilmente l'antialiasing
     del testo — verificato via confronto pixel-per-pixel con il sito
     live. Per restare identici al pixel, la proprietà è del tutto
     assente finché non serve davvero. */
  :root[data-theme]:not([data-theme="scuro"]) .card-interactive,
  :root[data-theme]:not([data-theme="scuro"]) .dashboard-panel,
  :root[data-theme]:not([data-theme="scuro"]) .windy-card,
  :root[data-theme]:not([data-theme="scuro"]) .modal-content,
  :root[data-theme]:not([data-theme="scuro"]) .cycle-item,
  :root[data-theme]:not([data-theme="scuro"]) .time-btn,
  :root[data-theme]:not([data-theme="scuro"]) .pollen-item,
  :root[data-theme]:not([data-theme="scuro"]) .twin-card {
    backdrop-filter: blur(var(--card-blur));
    -webkit-backdrop-filter: blur(var(--card-blur));
  }
</style>

<script id="theme-switcher">
(function() {
  var VALID_THEMES = ['scuro', 'chiaro', 'black', 'blu', 'green', 'pink', 'red', 'notte', 'violet', 'blackamoled', 'orange', 'teal', 'gold'];

  function applyTheme(name, persist) {
    if (VALID_THEMES.indexOf(name) === -1) return false;
    if (name === 'scuro') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', name);
    }
    if (persist) {
      try { localStorage.setItem('siteTheme', name); } catch (e) {}
    }
    return true;
  }

  // Chiamata esposta per l'app Android (WebView.evaluateJavascript) per
  // cambiare tema in tempo reale, senza dover ricaricare la pagina.
  window.setAppTheme = function(name) { applyTheme(name, true); };

  var params = new URLSearchParams(window.location.search);
  var fromUrl = params.get('theme');
  if (fromUrl) {
    applyTheme(fromUrl, true);
  } else {
    var stored = null;
    try { stored = localStorage.getItem('siteTheme'); } catch (e) {}
    if (stored) applyTheme(stored, false);
  }
})();
</script>

</head>
<body>
<h1>Reimposta la password</h1>
<div id="form">
    <input type="password" id="password" placeholder="Nuova password (min. 6 caratteri)">
    <input type="password" id="password2" placeholder="Conferma nuova password">
    <button id="btnSubmit">Reimposta password</button>
</div>
<div id="msg"></div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const msg = document.getElementById('msg');

if (!token) {
    msg.textContent = 'Link non valido: manca il token.';
    msg.className = 'error';
    document.getElementById('form').style.display = 'none';
}

document.getElementById('btnSubmit').addEventListener('click', function() {
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    msg.textContent = '';
    msg.className = '';

    if (p1.length < 6) {
        msg.textContent = 'La password deve avere almeno 6 caratteri.';
        msg.className = 'error';
        return;
    }
    if (p1 !== p2) {
        msg.textContent = 'Le due password non coincidono.';
        msg.className = 'error';
        return;
    }

    this.disabled = true;
    fetch('/reset_password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: p1 })
    })
    .then(r => r.json())
    .then(function(data) {
        if (data.success) {
            msg.textContent = 'Password aggiornata! Ora puoi accedere con la nuova password dall\'app.';
            msg.className = 'success';
            document.getElementById('form').style.display = 'none';
        } else {
            const errors = {
                'invalid_or_expired_token': 'Il link è scaduto o non è più valido. Richiedine uno nuovo dall\'app.',
                'password_too_short': 'La password deve avere almeno 6 caratteri.'
            };
            msg.textContent = errors[data.error] || 'Errore, riprova.';
            msg.className = 'error';
            document.getElementById('btnSubmit').disabled = false;
        }
    })
    .catch(function() {
        msg.textContent = 'Errore di connessione, riprova.';
        msg.className = 'error';
        document.getElementById('btnSubmit').disabled = false;
    });
});
</script>
</body>
</html>
