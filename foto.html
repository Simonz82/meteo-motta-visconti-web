<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Storiche - Motta Visconti</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-primary); 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        
        .back-btn { 
            display: inline-block; 
            background: var(--bg-card-2); 
            color: var(--text-secondary); 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px var(--shadow-soft);
            transition: background 0.2s;
        }
        
        .back-btn:hover { background: var(--border-color); color: var(--text-primary); }

        h1 { font-size: 1.6rem; margin-bottom: 5px; color: var(--accent-primary); font-weight: 800; letter-spacing: 0.5px; }
        p { color: var(--text-faint); font-size: 0.85rem; margin-bottom: 30px; font-weight: 500; }
        
        /* Griglia Foto Piccole */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); 
            gap: 10px; 
            padding-bottom: 40px; 
        }
        
        .gallery-item { 
            aspect-ratio: 1; 
            overflow: hidden; 
            border-radius: 10px; 
            cursor: pointer; 
            background: var(--bg-card); 
            box-shadow: 0 2px 8px var(--shadow-soft); 
        }
        
        .gallery-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.3s ease; 
        }
        
        .gallery-item:hover img { transform: scale(1.08); }

        /* Modal / Lightbox (Foto Ingrandita) */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: var(--overlay-bg); 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            backdrop-filter: blur(5px);
        }
        
        .modal img { 
            max-width: 95%; 
            max-height: 80vh; 
            border-radius: 8px; 
            box-shadow: 0 5px 30px var(--shadow-modal); 
            object-fit: contain; 
            user-select: none;
        }
        
        /* Controlli Lightbox */
        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            color: var(--text-body); 
            font-size: 40px; 
            font-weight: 300; 
            cursor: pointer; 
            z-index: 10000; 
            line-height: 1;
        }
        
        .nav-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--text-primary); 
            font-size: 35px; 
            cursor: pointer; 
            padding: 15px 20px; 
            user-select: none; 
            background: rgba(30,30,30,0.6); 
            border-radius: 50%; 
            z-index: 10000; 
            border: none; 
            backdrop-filter: blur(3px);
            transition: background 0.2s;
        }
        
        .nav-btn:hover { background: rgba(50,50,50,0.9); color: var(--accent-primary); }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }
        
        /* Contatore Foto */
        .counter { 
            position: absolute; 
            bottom: 30px; 
            color: var(--text-secondary-2); 
            font-size: 0.9rem; 
            font-weight: 600;
            letter-spacing: 1px; 
            background: var(--shadow-soft);
            padding: 5px 15px;
            border-radius: 20px;
        }
    </style>

  /* Applica il "vetro" (blur) SOLO quando un tema alternativo è attivo.
     La regola non è applicata affatto nel tema di default (nessun
     attributo, o data-theme="scuro"): anche un blur(0px) "innocuo"
     può forzare il browser a promuovere l'elemento su un layer di
     compositing a parte e alterare impercettibilmente l'antialiasing
     del testo — verificato via confronto pixel-per-pixel con il sito
     live. Per restare identici al pixel, la proprietà è del tutto
     assente finché non serve davvero. */

<script id="theme-switcher">
(function() {
  var VALID_THEMES = ['scuro', 'chiaro', 'black', 'blu', 'green', 'pink', 'red'];

  function applyTheme(name, persist) {
    if (VALID_THEMES.indexOf(name) === -1) return false;
    if (name === 'scuro') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', name);
    }
    if (persist) {
      try { localStorage.setItem('siteTheme', name); } catch (e) {}
    }
    return true;
  }

  // Chiamata esposta per l'app Android (WebView.evaluateJavascript) per
  // cambiare tema in tempo reale, senza dover ricaricare la pagina.
  window.setAppTheme = function(name) { applyTheme(name, true); };

  var params = new URLSearchParams(window.location.search);
  var fromUrl = params.get('theme');
  if (fromUrl) {
    applyTheme(fromUrl, true);
  } else {
    var stored = null;
    try { stored = localStorage.getItem('siteTheme'); } catch (e) {}
    if (stored) applyTheme(stored, false);
  }
})();
</script>

<body>

    <a href="index.html" class="back-btn">⬅ Torna al Meteo</a>
    <h1>Motta Visconti Ieri</h1>
    <p>Archivio fotografico storico del paese</p>

    <div class="gallery-grid" id="gallery">
        <!-- Le miniature verranno generate qui dallo script automatico -->
    </div>

    <!-- Schermo intero (Modal) -->
    <div id="imageModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
        <img id="modalImg" src="">
        <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
        <div class="counter" id="imgCounter"></div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const counter = document.getElementById('imgCounter');
        
        let fotoArray = [];
        let currentIndex = 0;

        // 1. CARICAMENTO AUTOMATICO DELL'ELENCO FOTO TRAMITE PHP
        fetch('foto_storiche/lista.php') 
            .then(response => {
                if (!response.ok) {
                    throw new Error("Errore di rete durante la richiesta del file PHP.");
                }
                return response.json();
            })
            .then(data => {
                // I dati ricevuti dal PHP sostituiscono la scrittura manuale
                fotoArray = data;
                costruisciGalleria();
            })
            .catch(error => {
                console.error("Errore nel caricamento dell'elenco foto:", error);
                gallery.innerHTML = "<p style='color:#ff5252;'>Errore: il file lista.php non è configurato correttamente o non è raggiungibile.</p>";
            });

        // 2. FUNZIONE PER CREARE LA GRIGLIA
        function costruisciGalleria() {
            if (fotoArray.length === 0) {
                gallery.innerHTML = "<p style='color:var(--text-secondary-2);'>Nessuna foto trovata nella cartella.</p>";
                return;
            }

            fotoArray.forEach((nomeFoto, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                const percorsoFoto = `foto_storiche/${nomeFoto}`;
                
                div.innerHTML = `<img src="${percorsoFoto}" loading="lazy" alt="Motta Visconti Storica">`;
                
                div.onclick = () => openModal(index);
                gallery.appendChild(div);
            });
        }

        // 3. FUNZIONI LIGHTBOX E NAVIGAZIONE
        function openModal(index) {
            currentIndex = index;
            updateModalImage();
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; 
        }

        function changeImage(direction) {
            currentIndex += direction;
            
            // Loop per ricominciare da capo
            if (currentIndex >= fotoArray.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = fotoArray.length - 1;
            }
            
            updateModalImage();
        }

        function updateModalImage() {
            const percorsoFoto = `foto_storiche/${fotoArray[currentIndex]}`;
            modalImg.src = percorsoFoto;
            counter.innerText = `${currentIndex + 1} / ${fotoArray.length}`;
        }

        // Navigazione da tastiera
        document.addEventListener('keydown', function(event) {
            if (modal.style.display === 'flex') {
                if (event.key === 'ArrowRight') changeImage(1);
                if (event.key === 'ArrowLeft') changeImage(-1);
                if (event.key === 'Escape') closeModal();
            }
        });
        
        // Chiudere cliccando fuori dalla foto
        modal.addEventListener('click', function(event) {
            if (event.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
