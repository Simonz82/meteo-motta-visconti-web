<script>/* Apertura sempre fresca: se il documento arriva dalla cache HTTP (nessun trasferimento di rete) lo ricarica subito, nascondendola, prima di disegnare la pagina (anche tornando indietro). */(function(){try{var n=performance.getEntriesByType('navigation')[0];if(n){if(n.type==='navigate'||n.type==='back_forward'){if(n.transferSize===0){document.documentElement.style.visibility='hidden';location.reload();}}}}catch(e){}})();</script>
<script>/* Sempre aggiornata: quando la pagina torna in primo piano (riapertura app, sblocco schermo, cambio scheda) dopo almeno 10 minuti in background si ricarica subito, salvo se stai compilando un campo o hai scelto un file. */(function(){var t=0;function busy(){var a=document.activeElement;if(a){var g=a.tagName;if(g==='INPUT'||g==='TEXTAREA'||g==='SELECT'){return true;}}var f=document.querySelectorAll('input[type=file]');for(var i=0;i<f.length;i++){if(f[i].files){if(f[i].files.length){return true;}}}return false;}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){t=Date.now();}else{if(t){if(Date.now()-t>600000){if(!busy()){location.reload();}}}t=0;}});window.addEventListener('pageshow',function(e){if(e.persisted){location.reload();}});})();</script>

    <title>Foto Storiche - Motta Visconti</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-primary); 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        
        .back-btn { 
            display: inline-block; 
            background: var(--bg-card-2); 
            color: var(--text-secondary); 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px var(--shadow-soft);
            transition: background 0.2s;
        }
        
        .back-btn:hover { background: var(--border-color); color: var(--text-primary); }

        h1 { font-size: 1.6rem; margin-bottom: 5px; color: var(--accent-primary); font-weight: 800; letter-spacing: 0.5px; }
        p { color: var(--text-faint); font-size: 0.85rem; margin-bottom: 30px; font-weight: 500; }
        
        /* Griglia Foto Piccole */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); 
            gap: 10px; 
            padding-bottom: 40px; 
        }
        
        .gallery-item { 
            aspect-ratio: 1; 
            overflow: hidden; 
            border-radius: 10px; 
            cursor: pointer; 
            background: var(--bg-card); 
            box-shadow: 0 2px 8px var(--shadow-soft); 
        }
        
        .gallery-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.3s ease; 
        }
        
        .gallery-item:hover img { transform: scale(1.08); }

        /* Modal / Lightbox (Foto Ingrandita) */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: var(--overlay-bg); 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            backdrop-filter: blur(5px);
        }
        
        .modal img { 
            max-width: 95%; 
            max-height: 80vh; 
            border-radius: 8px; 
            box-shadow: 0 5px 30px var(--shadow-modal); 
            object-fit: contain; 
            user-select: none;
        }
        
        /* Controlli Lightbox */
        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            color: var(--text-body); 
            font-size: 40px; 
            font-weight: 300; 
            cursor: pointer; 
            z-index: 10000; 
            line-height: 1;
        }
        
        .nav-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--text-primary); 
            font-size: 35px; 
            cursor: pointer; 
            padding: 15px 20px; 
            user-select: none; 
            background: rgba(30,30,30,0.6); 
            border-radius: 50%; 
            z-index: 10000; 
            border: none; 
            backdrop-filter: blur(3px);
            transition: background 0.2s;
        }
        
        .nav-btn:hover { background: rgba(50,50,50,0.9); color: var(--accent-primary); }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }
        
        /* Contatore Foto */
        .counter { 
            position: absolute; 
            bottom: 30px; 
            color: var(--text-secondary-2); 
            font-size: 0.9rem; 
            font-weight: 600;
            letter-spacing: 1px; 
            background: var(--shadow-soft);
            padding: 5px 15px;
            border-radius: 20px;
        }
    </style>

<script id="theme-switcher">
(function() {
  var VALID_THEMES = ['scuro', 'chiaro', 'black', 'blu', 'green', 'pink', 'red', 'notte', 'violet', 'blackamoled', 'orange', 'teal', 'gold'];

  function applyTheme(name, persist) {
    if (VALID_THEMES.indexOf(name) === -1) return false;
    if (name === 'scuro') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', name);
    }
    if (persist) {
      try { localStorage.setItem('siteTheme', name); } catch (e) {}
    }
    return true;
  }

  // Chiamata esposta per l'app Android (WebView.evaluateJavascript) per
  // cambiare tema in tempo reale, senza dover ricaricare la pagina.
  window.setAppTheme = function(name) { applyTheme(name, true); };

  var params = new URLSearchParams(window.location.search);
  var fromUrl = params.get('theme');
  if (fromUrl) {
    applyTheme(fromUrl, true);
  } else {
    var stored = null;
    try { stored = localStorage.getItem('siteTheme'); } catch (e) {}
    if (stored) applyTheme(stored, false);
  }
})();
</script>

<body>

    <a href="index.html" class="back-btn">⬅ Torna al Meteo</a>
    <h1>Motta Visconti Ieri</h1>
    <p>Archivio fotografico storico del paese</p>

    <div class="gallery-grid" id="gallery">
        <!-- Le miniature verranno generate qui dallo script automatico -->
    </div>

    <!-- Schermo intero (Modal) -->
    <div id="imageModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
        <img id="modalImg" src="">
        <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
        <div class="counter" id="imgCounter"></div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const counter = document.getElementById('imgCounter');
        
        let fotoArray = [];
        let currentIndex = 0;

        // 1. CARICAMENTO AUTOMATICO DELL'ELENCO FOTO TRAMITE PHP
        fetch('foto_storiche/lista.php') 
            .then(response => {
                if (!response.ok) {
                    throw new Error("Errore di rete durante la richiesta del file PHP.");
                }
                return response.json();
            })
            .then(data => {
                // I dati ricevuti dal PHP sostituiscono la scrittura manuale
                fotoArray = data;
                costruisciGalleria();
            })
            .catch(error => {
                console.error("Errore nel caricamento dell'elenco foto:", error);
                gallery.innerHTML = "<p style='color:#ff5252;'>Errore: il file lista.php non è configurato correttamente o non è raggiungibile.</p>";
            });

        // 2. FUNZIONE PER CREARE LA GRIGLIA
        function costruisciGalleria() {
            if (fotoArray.length === 0) {
                gallery.innerHTML = "<p style='color:var(--text-secondary-2);'>Nessuna foto trovata nella cartella.</p>";
                return;
            }

            fotoArray.forEach((nomeFoto, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                const percorsoFoto = `foto_storiche/${nomeFoto}`;
                
                div.innerHTML = `<img src="${percorsoFoto}" loading="lazy" alt="Motta Visconti Storica">`;
                
                div.onclick = () => openModal(index);
                gallery.appendChild(div);
            });
        }

        // 3. FUNZIONI LIGHTBOX E NAVIGAZIONE
        function openModal(index) {
            currentIndex = index;
            updateModalImage();
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; 
        }

        function changeImage(direction) {
            currentIndex += direction;
            
            // Loop per ricominciare da capo
            if (currentIndex >= fotoArray.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = fotoArray.length - 1;
            }
            
            updateModalImage();
        }

        function updateModalImage() {
            const percorsoFoto = `foto_storiche/${fotoArray[currentIndex]}`;
            modalImg.src = percorsoFoto;
            counter.innerText = `${currentIndex + 1} / ${fotoArray.length}`;
        }

        // Navigazione da tastiera
        document.addEventListener('keydown', function(event) {
            if (modal.style.display === 'flex') {
                if (event.key === 'ArrowRight') changeImage(1);
                if (event.key === 'ArrowLeft') changeImage(-1);
                if (event.key === 'Escape') closeModal();
            }
        });
        
        // Chiudere cliccando fuori dalla foto
        modal.addEventListener('click', function(event) {
            if (event.target === modal) {
                closeModal();
            }
        });
    </script>

<div id="pageVisitCounter" style="text-align:center; font-size:0.805rem; color:#888; padding:16px 0 6px; opacity:0.7;"></div>
<script>
(function() {
  var PAGE_SLUG = 'foto';
  function pvcFmt(n) { var s = String(n), o = ""; while (s.length > 3) { o = "." + s.slice(-3) + o; s = s.slice(0, -3); } return s + o; }
  // Nuova visita = prima pagina dopo 30 minuti di inattivita' sul sito (come Matomo).
  function pvcNuova() { try { var k = 'pvcLastHit', now = Date.now(), last = parseInt(localStorage.getItem(k) || '0', 10); localStorage.setItem(k, String(now)); return (!last || now - last > 1800000) ? 1 : 0; } catch (e) { return 0; } }
  var pvcIsApp = navigator.userAgent.indexOf('MeteoMottaAndroidApp') !== -1;
  function pvcToken() {
    if (pvcIsApp) {
      try { return (typeof AndroidBridge !== 'undefined' && AndroidBridge.getToken) ? AndroidBridge.getToken() : null; } catch (e) { return null; }
    }
    try { return localStorage.getItem('webAccountToken'); } catch (e) { return null; }
  }
  fetch('/visite.php?action=hit&page=' + PAGE_SLUG + '&nuova=' + pvcNuova())
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.success) return;
      var token = pvcToken();
      if (!token) return;
      fetch('/account.php', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(acc) {
          if (acc && acc.success && acc.ruolo === 'owner') {
            var el = document.getElementById('pageVisitCounter');
            if (el) el.innerText = '\ud83d\udc41 ' + pvcFmt(d.visite_totali) + ' visite totali (' + pvcFmt(d.visite_oggi) + ' oggi)';
          }
        })
        .catch(function() {});
    })
    .catch(function() {});
})();
</script>
